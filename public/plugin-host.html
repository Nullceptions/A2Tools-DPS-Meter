<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plugin</title>
    <link rel="stylesheet" href="/src/js/pluginHost.css" />
  </head>
  <body>
    <header class="pluginBar">
      <span class="pluginName"></span>
      <span class="pluginBadge" hidden>Unreviewed plugin</span>
      <input type="range" class="pluginOpacity" min="20" max="100" step="5" value="100" aria-label="Background opacity" title="Background opacity" />
      <button type="button" class="pluginCompact" aria-label="Hide the controls" title="Hide the controls" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
      </button>
      <button type="button" class="pluginClose" aria-label="Close" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>
    <main class="pluginStage"></main>
    <div class="pluginToast" role="status" hidden></div>
    <script src="/src/js/pluginHost.js"></script>
  </body>
</html>
